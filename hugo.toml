baseURL = "https://wohoef.github.io/"
locale = "en-us"
title = "Wolter van der Hoef"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[markup]
  [markup.goldmark.renderer]
    unsafe = true  # allow raw HTML in posts, e.g. to embed an interactive figure
  [markup.highlight]
    style = "github"

[params]
  env = "production"
  description = "Notes and experiments on machine learning."
  author = "Wolter van der Hoef"
  defaultTheme = "auto"  # follows the reader's light/dark setting
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = false
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = "Wolter van der Hoef"
    Content = '''
I'm doing an MSc in Mathematics and Foundations of Computer Science at the University of Oxford, after a BSc in Liberal Arts and Sciences at Amsterdam University College (cum laude, with a [thesis on ordinal Turing machines](https://dspace.uba.uva.nl/server/api/core/bitstreams/d4f3a9df-44e8-496e-83d9-e13918d93133/content)).

Alongside my studies I worked on machine learning in practice: predicting flight delays across the world's airports for SITA, and vehicle safety at Machine Learning Programs. I also built software at Technolution and was the sole smart contract developer at a Web3 startup.

Here I write up small experiments and personal projects.
'''

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/wohoef"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/wolter-van-der-hoef-2415431b5"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"
